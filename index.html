<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 필수: 이 태그가 없으면 폰에서 PC용 화면처럼 축소되어 터치가 스크롤/확대로 해석됨 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>Interactive Design Archive · 배지은</title>

    <!-- 글꼴: 큰 제목 Archivo · 작은 표기 Space Mono · 한글 IBM Plex Sans KR -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:wght@400;700&family=Tinos:wght@400;700&family=Pinyon+Script&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nanum+Gothic+Coding:wght@400;700&display=swap"
    />

    <style>
      :root {
        --ink: #e8e8e8;
        --mute: #8b8b8b;
        --tag: #161616;
        --mono: "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
      }
      /* 허브 페이지는 절대 스크롤/선택되지 않게 고정 (아이폰에서 터치가 페이지 스크롤로 새는 것 방지) */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        background: radial-gradient(70% 60% at 50% 45%, #1b1b1d, #050505 70%) #050505;
        color: var(--ink);
        font-family: var(--mono);
        touch-action: none;
      }
      /* 아래층: 실제 작품(iframe)이 들어가는 3D 레이어 · 위층: 바인더를 그리는 WebGL 캔버스 */
      #css,
      #gl {
        position: fixed;
        inset: 0;
      }
      #gl {
        pointer-events: none; /* 클릭은 아래 작품까지 통과 */
        z-index: 2;
      }
      #css {
        z-index: 1;
      }
      .work {
        width: 1600px;
        height: 1000px;
        background: #000;
      }
      .work iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* ── 화면 위 조작 ── */
      /* ── 전체 보기: 속지를 빼서 책상 위에 나란히 펼쳐 놓은 모습 ── */
      #gl, #css { transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s, filter .6s; }
      body.overview #gl, body.overview #css { transform: scale(.82) translateY(-4%); opacity: .18; filter: blur(2px); pointer-events: none; }
      #desk { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 40px 90px; pointer-events: none; opacity: 0; transition: opacity .35s; }
      body.overview #desk { pointer-events: auto; opacity: 1; }
      #sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: clamp(16px, 2.4vw, 34px); width: min(1180px, 100%); }
      .sheet { position: relative; aspect-ratio: 16 / 10; border: 0; padding: 0; background: #fbfbfb; cursor: pointer; box-shadow: 0 18px 40px rgba(0,0,0,.55); border-radius: 3px; overflow: visible;
        transform: translateY(60px) rotate(var(--r)) scale(.9); opacity: 0; transition: transform .55s cubic-bezier(.2,.9,.25,1.15), opacity .4s, box-shadow .25s; transition-delay: var(--d); }
      body.overview .sheet { transform: rotate(var(--r)); opacity: 1; }
      body.overview .sheet:hover { transform: rotate(0) translateY(-8px) scale(1.03); box-shadow: 0 26px 50px rgba(0,0,0,.65); transition-delay: 0s; }
      .sheet { background: #111; }
      .sheet .scr { position: absolute; inset: 0; overflow: hidden; border-radius: 3px; background: #111; }
      .sheet .scr iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; border: 0; transform-origin: 0 0; pointer-events: none; }
      .sheet .soonTxt { position: absolute; inset: 0; display: grid; place-items: center; color: #777; font: 600 14px "IBM Plex Mono", monospace; letter-spacing: .1em; }
      .sheet .cap { position: absolute; left: 0; right: 0; top: calc(100% + 10px); text-align: left; color: #ddd; font: 600 14px "IBM Plex Mono", "Nanum Gothic Coding", monospace; letter-spacing: .02em; }
      .sheet .cap small { display: block; color: #8b8b8b; font-weight: 400; font-size: 12px; margin-top: 2px; }
      #sheets { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; column-gap: 40px !important; row-gap: 70px !important; width: min(1000px, 100%, calc((100vh - 270px) * 1.5)) !important; }
      @media (max-width: 640px) { #sheets { grid-template-columns: 1fr !important; } }
      .sheet .n { position: absolute; left: 0; transform: translateX(-100%); top: 14%; background: #dedede; color: #2a2a2a; font: 500 15px "IBM Plex Mono", monospace; padding: 4px 12px 4px 10px; border-radius: 4px 0 0 4px; box-shadow: -2px 2px 6px rgba(0,0,0,.3); }
      .sheet.soon { filter: grayscale(1) brightness(.8); }
      #deskHint { margin: 0; color: var(--mute); font-size: 12px; }
      body.overview #hint { opacity: 0 !important; }
      #bar {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--mute);
        white-space: nowrap;
      }
      #bar button,
      #bar a {
        background: transparent;
        color: var(--ink);
        border: 1px solid #3a3a3a;
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 12px;
        cursor: pointer;
        text-decoration: none;
      }
      #bar button:hover,
      #bar a:hover {
        border-color: var(--ink);
      }
      #bar .play {
        background: var(--ink);
        color: #111;
      }
      #bar a[hidden] {
        display: none;
      }
      #tabs {
        position: fixed;
        right: calc(14px + env(safe-area-inset-right, 0px));
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #tabs button {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #333;
        padding: 8px 10px;
        cursor: pointer;
        text-align: left;
      }
      #tabs button.on {
        background: var(--tag);
        border-color: var(--tag);
        color: #fff;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: calc(18px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        z-index: 10;
        font-size: 12px;
        color: var(--mute);
        white-space: nowrap;
        transition: opacity 0.6s;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--tag);
        outline-offset: 2px;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 20;
        font-size: 12px;
        color: var(--mute);
        background: #050505;
        transition: opacity 0.6s;
      }
    </style>

    <!-- three.js (3D) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="css"></div>
    <canvas id="gl"></canvas>

    <div id="hint">표지를 눌러서 펼치세요</div>
    <div id="bar">
      <button id="prevBtn" aria-label="이전 장">←</button>
      <span id="count">00 / 00</span>
      <button id="nextBtn" aria-label="다음 장">→</button>
      <button id="allBtn">▦ 전체 보기</button>
      <a id="openBtn" target="_blank" hidden>새 창 ↗</a>
    </div>
    <div id="desk" aria-hidden="true"><div id="sheets"></div></div>
    <div id="loading">바인더를 펼치는 중…</div>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";

      /* ─────────────────────────────────────────
         과제 목록 — 과제가 늘면 여기에 한 칸 추가
         folder : 깃허브 폴더 이름 (그 안의 index.html이 오른쪽 종이에서 실행됨 · 비우면 '준비 중')
         notes  : 과정 · 바뀐 점 (줄마다 하나)
         ───────────────────────────────────────── */
      const WORKS = [
        // title = 내가 붙인 작품 이름 · type = 맨 윗줄 작은 글씨 (과제 구분 · 과제명)
        // desc = ABOUT (한 항목 = 한 번호) · how = HOW TO PLAY ("터치 동작 → 결과" 한 줄씩)
        {
          folder: "DynamicBalance",
          title: "Blossom in Motion",
          type: "소과제 · Dynamic Balance",
          en: "EXERCISE",
          date: "09 / 15",
          desc: [
            "좌우로 흔들리는 대포가 쏘아 올린 벚꽃빛 농구공들이 톱니와 경사판에 튕기며 화면 곳곳으로 흩날립니다.",
            "시소에 떨어진 공은 크기마다 무게가 달라 시소를 이리저리 기울게 합니다.",
            "예측할 수 없는 물리의 움직임을 봄바람에 흩날리는 벚꽃잎처럼 표현했습니다.",
          ],
          how: ["터치 없이 지켜보기", "새 창 ↗ → 처음부터 다시"],
        },
        {
          folder: "Delete, Delete, Delete",
          title: "Moving On",
          type: "소과제 · Delete, Delete, Delete",
          en: "EXERCISE",
          date: "10 / 06",
          desc: [
            "헤어진 지 일주일, 새벽 책상 위에서 \n전 연인과의 추억을 정리한다.",
            "폴라로이드는 누르면 바로 구겨지고, \n편지는 문지르면 찢어져 흩날리고, 인생네컷은 라이터를 세 번 켜야 불이 붙는다.",
          ],
          how: [
            "위 1 · 2 · 3 탭 → 단계 고르기",
            "폴라로이드 탭 → 구겨짐",
            "편지 누른 채 문지르기 → 찢김",
            "손 떼기 → 조각이 흩날림",
            "라이터 세 번 탭 → 불이 켜짐",
            "라이터를 사진에 대기 → 탐",
          ],
        },
        {
          folder: "Drama_Ticket",
          title: "Drama Diary",
          type: "중간과제 · You memo? I memo!",
          en: "MIDTERM",
          date: "10 / 27",
          desc: [
            "드라마를 다시 볼 때마다 왜 좋았는지, \n어떤 화가 좋았는지 자꾸 잊어버렸습니다.",
            "그래서 드라마 한 편을 티켓 한 장으로 만들어, 회차마다 느낀 걸 남기는 메모장을 만들었습니다.",
            "다시 정주행하면 지난 기록과 지금을 비교하며 볼 수 있습니다.",
          ],
          how: [
            "+ 새 티켓 탭 → 제목 쓰고 자동 찾기",
            "티켓 탭 → 크게 열기",
            "한 번 더 탭 · 옆으로 밀기 → 뒤집기",
            "회차 띠 위아래로 긋기 → 화마다 평점",
            "띠 길게 누르기 → 그 화 메모",
            "N회차 보기 탭 → 새 회차로 다시 보기",
          ],
        },
        {
          folder: "",
          title: "Final Project",
          type: "기말과제",
          en: "FINAL",
          date: "— / —",
          desc: [],
          how: [],
        },
      ];
      const NAME = "Jieun Bae"; // 표지 영문 이름
      const SID = "C535163"; // 학번
      const COURSE = "Interactive Design (2)";
      const TERM = "2026 2학기";

      const S = WORKS.length; // 펼친 면 개수 (표지를 열면 바로 01)
      const ACCENT = "#161616"; // 포인트 색 (무채색: 거의 검정)
      const LEAVES = S - 1; // 넘기는 종이 장수
      const pad = (n) => String(n).padStart(2, "0");

      /* ── 종이 크기 (3D 단위) ── */
      // 가로로 긴 책 (작품 대부분이 가로 화면이라 종이도 가로형 16:10)
      const PW = 1.6; // 종이 폭 (고리 → 바깥)
      const PH = 1.0; // 종이 높이
      const P0 = 0.06; // 고리에서 종이가 시작하는 거리
      const TW = 1600; // 종이 그림 크기 (px)
      const TH = 1000;
      // 오른쪽 종이에서 작품이 뜨는 칸 (종이 그림 기준 px, 약 16:9)
      const FR = { x: 0, y: 0, w: 1600, h: 1000 }; // 오른쪽 면 전체가 작품 화면
      const CVW = PW + 0.15; // 표지 폭
      const CVX = P0 + PW / 2 + 0.04; // 표지 중심 x

      /* ═════════ 1. 종이 그림 (캔버스에 글자 · 표 그리기) ═════════ */
      const F = {
        // 안쪽 글씨: 타자기 느낌의 고정폭 (영문 IBM Plex Mono · 한글 나눔고딕코딩)
        type: (px, w = 400, it) => `${it ? "italic " : ""}${w} ${px}px "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace`,
        // 표지: 굵은 산세리프 + 필기체
        sans: (px, w = 800) => `${w} ${px}px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif`,
        script: (px) => `400 ${px}px "Pinyon Script", "Snell Roundhand", cursive`,
      };
      F.mono = (px, w = 400) => F.type(px, w); // 예전 이름 호환
      F.kr = (px, w = 400) => F.type(px, w);
      F.head = (px, it) => F.type(px, 400, it);
      F.serifKr = (px, w = 400) => F.type(px, w);
      const isKr = (t) => /[가-힣]/.test(t);

      function wrap(ctx, text, maxW) {
        const out = [];
        for (const para of String(text).split("\n")) {
          let line = "";
          for (const ch of para.split(/(\s+)/)) {
            const t = line + ch;
            if (ctx.measureText(t).width > maxW && line.trim()) {
              out.push(line.trim());
              line = ch.trimStart();
            } else line = t;
          }
          // 너무 긴 한 단어(한글 문장)는 글자 단위로 자르기
          while (ctx.measureText(line).width > maxW) {
            let k = line.length;
            while (k > 1 && ctx.measureText(line.slice(0, k)).width > maxW) k--;
            out.push(line.slice(0, k));
            line = line.slice(k);
          }
          out.push(line.trim());
        }
        return out;
      }
      function noise(ctx, w, h, a) {
        const id = ctx.getImageData(0, 0, w, h);
        for (let i = 0; i < id.data.length; i += 4) {
          const n = (Math.random() - 0.5) * a;
          id.data[i] += n;
          id.data[i + 1] += n;
          id.data[i + 2] += n;
        }
        ctx.putImageData(id, 0, 0);
      }
      function mark(ctx, x, y, r, col) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.moveTo(x - r, y);
        ctx.lineTo(x + r, y);
        ctx.moveTo(x, y - r);
        ctx.lineTo(x, y + r);
        ctx.stroke();
      }
      function headerRow(ctx, left, right, ink) {
        mark(ctx, 92, 92, 24, ink);
        ctx.fillStyle = ink;
        ctx.font = F.mono(28);
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText(left, 136, 92);
        ctx.textAlign = "right";
        ctx.fillText(right.toUpperCase(), TW - 70, 92);
        ctx.textAlign = "left";
        ctx.fillRect(70, 128, TW - 140, 4);
      }
      function specTable(ctx, cols) {
        const y = TH - 190;
        const x0 = 70;
        const w = TW - 140;
        const ws = [0.22, 0.34, 0.22, 0.22];
        ctx.fillStyle = "#141414";
        ctx.fillRect(x0, y, w, 4);
        ctx.fillRect(x0, y + 120, w, 2);
        let x = x0;
        cols.forEach(([k, v], i) => {
          if (i) ctx.fillRect(x, y, 2, 120);
          ctx.fillStyle = "#6e6e6e";
          ctx.font = F.mono(22);
          ctx.textBaseline = "alphabetic";
          ctx.fillText(k.toUpperCase(), x + (i ? 18 : 0), y + 46);
          ctx.fillStyle = "#141414";
          ctx.font = F.mono(29);
          let t = String(v);
          const mw = w * ws[i] - 24;
          while (ctx.measureText(t).width > mw && t.length > 2) t = t.slice(0, -2) + "…";
          ctx.fillText(t, x + (i ? 18 : 0), y + 94);
          x += w * ws[i];
        });
      }
      function volTag(ctx, x, y, n) {
        ctx.fillStyle = ACCENT;
        ctx.fillRect(x, y, 150, 156);
        ctx.fillStyle = "#fff";
        ctx.font = F.mono(24);
        ctx.textBaseline = "alphabetic";
        ctx.fillText("VOL.", x + 18, y + 40);
        ctx.font = F.head(96);
        ctx.fillText(n, x + 14, y + 136);
      }
      // 제목: 고정폭 대문자 (넘치면 글자 크기를 줄여 2줄 안에)
      function bigTitle(ctx, text, y, maxLines = 2, maxW = TW - 140) {
        let size = 76;
        let lines;
        const t = isKr(text) ? text : text.toUpperCase();
        for (;;) {
          ctx.font = F.type(size, 700); // 제목은 굵게
          lines = wrap(ctx, t, maxW);
          const widest = Math.max(...lines.map((l) => ctx.measureText(l).width));
          if ((lines.length <= maxLines && widest <= maxW) || size < 40) break;
          size -= 4;
        }
        ctx.fillStyle = "#141414";
        ctx.textBaseline = "alphabetic";
        lines.forEach((l, i) => ctx.fillText(l, 70, y + size + i * size * 1.18));
        return y + size + (lines.length - 1) * size * 1.18 + 40;
      }
      // 타자기 원고처럼 점선 한 줄
      function dashLine(ctx, x0, y, x1, col = "#141414") {
        ctx.fillStyle = col;
        for (let x = x0; x < x1; x += 22) ctx.fillRect(x, y, 12, 2);
      }

      function drawLeft(s) {
        const c = document.createElement("canvas");
        c.width = TW;
        c.height = TH;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#f7f7f6";
        ctx.fillRect(0, 0, TW, TH);
        noise(ctx, TW, TH, 12);
        const w = WORKS[s];
        // 맨 윗줄: 과제 구분 (작게)
        ctx.fillStyle = "#444";
        ctx.font = F.type(32, 600);
        ctx.textBaseline = "alphabetic";
        ctx.fillText(`[${pad(s + 1)}]  ${w.type}`, 70, 110);
        // 제목 + 점선 하나
        let y = bigTitle(ctx, w.title, 136, 2, TW - 140);
        dashLine(ctx, 70, y - 6, TW - 70);
        // 줄 노트처럼: 모든 글자가 옅은 가로줄 위에 놓이게 한 줄 간격(LH)에 맞춰 배치
        // 머리글(ABOUT · HOW TO PLAY)이 첫 줄, 글은 그 다음 줄부터. 문단 사이는 빈 줄 하나
        // 글이 길면 두 단이 같은 크기를 유지한 채 함께 작아져서 종이 안에 다 들어감
        const BASE0 = y + 76, // 첫 줄(머리글) 글자 밑선
          MAXY = TH - 50;
        const descs = (Array.isArray(w.desc) ? w.desc : [w.desc]).filter((t) => String(t).trim());
        const cols = [
          { items: descs, x: 70, width: TOCX - 70 - 64, mark: "none", gap: 1 }, // ABOUT: 문단 사이 빈 줄 1

      }

      /* ── 종이 · 비닐 속지 재료 ── */
      function tex(canvas, mirror) {
        const t = new THREE.CanvasTexture(canvas);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        if (mirror) {
          t.wrapS = THREE.RepeatWrapping;
          t.repeat.x = -1;
          t.offset.x = 1;
        }
        return t;
      }
      const paperMat = (map, side) =>
        new THREE.MeshStandardMaterial({ map, roughness: 0.8, side, envMapIntensity: 0.28, emissive: 0xffffff, emissiveMap: map, emissiveIntensity: 0.5 }); // 세워져도 회색으로 죽지 않게
      // 비닐: 색은 없고 반사(빛 맺힘)만 더해지는 투명 막
      const sleeveMat = new THREE.MeshPhysicalMaterial({
        color: 0x000000,
        roughness: 0.04,
        metalness: 0,
        clearcoat: 1,
        clearcoatRoughness: 0.02,
        envMapIntensity: 0.5,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      // 빛만 더하고 투명도는 그대로 두는 섞기 (그래야 비닐 아래 작품이 비쳐 보임)
      function glossBlend(m, useAlpha) {
        m.blending = THREE.CustomBlending;
        m.blendEquation = THREE.AddEquation;
        m.blendSrc = useAlpha ? THREE.SrcAlphaFactor : THREE.OneFactor;
        m.blendDst = THREE.OneFactor;
        m.blendSrcAlpha = THREE.ZeroFactor;
        m.blendDstAlpha = THREE.OneFactor;
        return m;
      }
      glossBlend(sleeveMat, false);
      // 비닐 위 반사 줄무늬 (빛을 더하는 방식)
      const streakCanvas = (() => {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 512;
        const x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 512, 512);
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(0.38, "rgba(255,255,255,0)");
        g.addColorStop(0.45, "rgba(255,255,255,.55)");
        g.addColorStop(0.48, "rgba(255,255,255,.08)");
        g.addColorStop(0.54, "rgba(255,255,255,.35)");
        g.addColorStop(0.62, "rgba(255,255,255,0)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g;
        x.fillRect(0, 0, 512, 512);
        return c;
      })();
      const streakTex = new THREE.CanvasTexture(streakCanvas);
      streakTex.wrapS = THREE.ClampToEdgeWrapping;
      const streakMat = new THREE.MeshBasicMaterial({
        map: streakTex,
        transparent: true,
        opacity: 0.13,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      glossBlend(streakMat, true);
      // 비닐 반들거림은 끔 (종이만 보이게)
      sleeveMat.visible = false;
      streakMat.visible = false;

      /* ── 휘어지며 넘어가는 종이 ── */
      const SEG = 40;
      function pageGeom() {
        const g = new THREE.PlaneGeometry(PW, PH, SEG, 1);
        g.rotateX(-Math.PI / 2);
        g.translate(P0 + PW / 2, 0, 0);
        const pos = g.attributes.position;
        g.userData.s = Float32Array.from({ length: pos.count }, (_, i) => pos.getX(i)); // 고리에서의 거리
        g.userData.z = Float32Array.from({ length: pos.count }, (_, i) => pos.getZ(i));
        return g;
      }
      // θ = 0 (오른쪽에 누움) → π (왼쪽에 누움) · bend = 휘는 정도 · lift = 들림
      function bendGeom(g, theta, bend, y0, lift) {
        const pos = g.attributes.position;
        const s = g.userData.s,
          z = g.userData.z;
        const N = 60;
        const maxS = P0 + PW;
        // 고리에서 바깥쪽으로 조금씩 걸어가며 위치 계산 (바깥쪽이 늦게 따라오며 휘어짐)
        const xs = [0],
          ys = [0];
        let x = 0,
          y = 0;
        for (let k = 1; k <= N; k++) {
          const ss = (k / N) * maxS;
          const a = theta - bend * ss * ss;
          x += (maxS / N) * Math.cos(a);
          y += (maxS / N) * Math.sin(a);
          xs.push(x);
          ys.push(y);
        }
        for (let i = 0; i < pos.count; i++) {
          const f = (s[i] / maxS) * N;
          const k = Math.min(N - 1, Math.floor(f));
          const t = f - k;
          pos.setXYZ(i, xs[k] + (xs[k + 1] - xs[k]) * t, y0 + lift + ys[k] + (ys[k + 1] - ys[k]) * t, z[i]);
        }
        pos.needsUpdate = true;
        g.computeVertexNormals();
        // 바깥 끝 위치 · 기울기 (색인 탭이 따라 붙도록)
        g.userData.end = { x: xs[N], y: y0 + lift + ys[N], a: theta - bend * maxS * maxS };
      }

      /* ── 종이 바깥쪽에 붙은 색인 탭 ── */
      const TABW = 0.17, // 종이 밖으로 나온 길이
        TABH = 0.12,
        TABGAP = 0.03;
      const tabZ = (i) => -PH / 2 + 0.09 + TABH / 2 + i * (TABH + TABGAP);
      const tabObjs = [];
      function makeTab(i, parent = scene) {
        const geo = new THREE.PlaneGeometry(TABW + 0.03, TABH);
        geo.rotateX(-Math.PI / 2);
        geo.translate((TABW + 0.03) / 2 - 0.03, 0, 0); // 종이 안쪽으로 살짝 겹쳐 붙임
        const texOff = tex(drawTab(i + 1, false)),
          texOn = tex(drawTab(i + 1, true));
        const texOffB = tex(drawTab(i + 1, false, true), true),
          texOnB = tex(drawTab(i + 1, true, true), true);
        const mk = (map, side) => new THREE.MeshStandardMaterial({ map, side, transparent: true, alphaTest: 0.5, roughness: 0.7, envMapIntensity: 0.3 });
        const front = new THREE.Mesh(geo, mk(texOff, THREE.FrontSide));
        const back = new THREE.Mesh(geo, mk(texOffB, THREE.BackSide));
        front.castShadow = back.castShadow = true;
        front.userData.tab = back.userData.tab = i;
        const grp = new THREE.Group();
        grp.add(front, back);
        grp.position.z = tabZ(i);
        parent.add(grp);
        const t = { i, grp, front, back, set(on) {
          front.material.map = on ? texOn : texOff;
          back.material.map = on ? texOnB : texOffB;
        } };
        tabObjs.push(t);
        return t;
      }
      function placeTab(t, end) {
        t.grp.position.x = end.x;
        t.grp.position.y = end.y + 0.0004;
        t.grp.rotation.z = end.a;
      }

      // 맨 아래 두 장 (표지 면 왼쪽 · 마지막 면 오른쪽)
      function flatPage(canvas, left) {
        const grp = new THREE.Group();
        const g = new THREE.PlaneGeometry(PW, PH);
        g.rotateX(-Math.PI / 2);
        const m = new THREE.Mesh(g, paperMat(tex(canvas), THREE.FrontSide));
        m.receiveShadow = true;
        const sl = new THREE.Mesh(g, sleeveMat);
        sl.position.y = 0.0015;
        const st = new THREE.Mesh(g, streakMat);
        st.position.y = 0.0018;
        grp.add(m, sl, st);
        grp.position.set((left ? -1 : 1) * (P0 + PW / 2), left ? 0.004 - HINGE : 0.004, 0);
        (left ? frontCover : scene).add(grp);
        return { grp, mesh: m, streak: st };
      }

      const leaves = [];
      const pages = []; // 면마다 오른쪽 종이 정보 (작품 칸 위치 계산용)

      /* ═════════ 3. 작품(iframe) 레이어 ═════════ */
      const workEl = document.createElement("div");
      workEl.className = "work";
      const iframe = document.createElement("iframe");
      iframe.allow = "fullscreen";
      workEl.appendChild(iframe);
      // 작품 캔버스가 고정 크기(예: 1000×700)라 칸보다 작으면 → 칸에 꽉 차게 키우고 가운데로, 여백은 작품 배경색으로
      // (같은 사이트 안에서만 됨: GitHub Pages OK. p5는 CSS로 키워도 마우스 좌표를 알아서 맞춰 줌)
      function fitFrame(iframe) {
        let tries = 0;
        const fit = () => {
          let doc;
          try {
            doc = iframe.contentDocument;
          } catch {
            return;
          }
          const cv = doc && doc.querySelector("canvas");
          if (!cv) return ++tries < 30 && setTimeout(fit, 150);
          const W = doc.documentElement.clientWidth,
            H = doc.documentElement.clientHeight;
          if (cv.width >= W * 0.92 || cv.height >= H * 0.92) return; // 이미 화면에 맞춘 작품은 그대로
          const k = Math.min(W / cv.width, H / cv.height);
          Object.assign(cv.style, {
            position: "absolute",
            left: (W - cv.width * k) / 2 + "px",
            top: (H - cv.height * k) / 2 + "px",
            width: cv.width * k + "px",
            height: cv.height * k + "px",
          });
          // 여백 색 = 작품 캔버스 왼쪽 아래 구석 색 (작품이 그려진 뒤에 한 번 더)
          const paint = () => {
            try {
              const t = document.createElement("canvas");
              t.width = t.height = 1;
              const tx = t.getContext("2d");
              tx.drawImage(cv, 2, cv.height - 3, 1, 1, 0, 0, 1, 1);
              const px = tx.getImageData(0, 0, 1, 1).data;
              const col = `rgb(${px[0]},${px[1]},${px[2]})`;
              doc.documentElement.style.background = doc.body.style.background = col;
            } catch {}
          };
          paint();
          setTimeout(paint, 600);
        };
        fit();
      }
      iframe.addEventListener("load", () => fitFrame(iframe));
      const workObj = new CSS3DObject(workEl);
      workObj.rotation.x = -Math.PI / 2;
      workObj.scale.setScalar((FR.w / TW) * PW / 1600);
      cssScene.add(workObj);
      // WebGL 쪽에 '구멍'을 뚫어 아래 iframe이 보이게 함
      const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0, transparent: false, blending: THREE.NoBlending });
      const hole = new THREE.Mesh(new THREE.PlaneGeometry((FR.w / TW) * PW, (FR.h / TH) * PH), holeMat);
      hole.rotation.x = -Math.PI / 2;
      hole.renderOrder = 1;
      scene.add(hole);
      // 작품 칸 중심 (오른쪽에 누운 종이 기준)
      const frameCX = P0 + ((FR.x + FR.w / 2) / TW) * PW;
      const frameCZ = -PH / 2 + ((FR.y + FR.h / 2) / TH) * PH;

      /* ═════════ 4. 넘기기 상태 ═════════ */
      let cur = 0;
      const STEP = 0.0022; // 종이 사이 높이
      function restY(i, flipped) {
        return flipped ? 0.006 + STEP * i : 0.006 + STEP * (LEAVES - i);
      }
      function placeLeaf(lf) {
        const th = lf.theta;
        const p = th / Math.PI;
        const mid = Math.sin(Math.PI * p);
        // 바깥쪽이 살짝 늦게 따라오는 부드러운 휨 + 넘어가는 동안 고리 쪽이 조금 들림
        const bend = lf.dir * 0.13 * mid;
        const y0 = restY(lf.i, false) * (1 - p) + restY(lf.i, true) * p + 0.02 * mid;
        bendGeom(lf.geom, th, bend, y0, 0);
        bendGeom(lf.sgeom, th, bend, y0 + 0.0016, 0);
        if (lf.tab) placeTab(lf.tab, lf.geom.userData.end);
      }

      function build() {
        const lefts = Array.from({ length: S }, (_, s) => drawLeft(s));
        buildDesk();
        const rights = Array.from({ length: S }, (_, s) => drawRight(s));
        const bl = flatPage(lefts[0], true);
        const br = flatPage(rights[S - 1], false);
        streaks.push(bl.streak, br.streak);
        // 마지막 장(맨 아래 오른쪽 종이)의 탭
        // 색인 탭은 각 작품의 '설명 면'(왼쪽 종이)에 붙음 → 지금 보는 작품 탭은 늘 왼쪽 맨 위에
        // 01 탭: 앞표지 안쪽에 붙은 첫 설명 면의 바깥(왼쪽) 끝
        placeTab(makeTab(0, frontCover), { x: -(P0 + PW), y: 0.004 - HINGE + 0.0004, a: Math.PI });
        for (let i = 0; i < LEAVES; i++) {
          const geom = pageGeom();
          const sgeom = pageGeom();
          const front = new THREE.Mesh(geom, paperMat(tex(rights[i]), THREE.FrontSide));
          const back = new THREE.Mesh(geom, paperMat(tex(lefts[i + 1], true), THREE.BackSide));
          front.castShadow = back.castShadow = true;
          front.receiveShadow = back.receiveShadow = true;
          const sl = new THREE.Mesh(sgeom, sleeveMat);
          const st = new THREE.Mesh(sgeom, streakMat);
          streaks.push(st);
          scene.add(front, back, sl, st);
          const lf = { i, geom, sgeom, theta: 0, dir: 1, anim: null, moving: false, meshes: [front, back], tab: makeTab(i + 1) }; // 이 종이의 뒷면 = 다음 작품 설명 면
          leaves.push(lf);
          placeLeaf(lf);
        }
      }
      const streaks = [];

      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      function animLeaf(lf, to, delay = 0, dur = 820) {
        lf.dir = to > lf.theta ? 1 : -1;
        lf.anim = { from: lf.theta, to, t0: performance.now() + delay, dur };
      }
      function anyMoving() {
        return leaves.some((l) => l.anim) || drag || opening;
      }

      /* ── 표지 열기 · 닫기 ── */
      let closed = true; // 처음엔 표지가 닫혀 있음
      function coverTo(to, dur, then) {
        opening = { t0: performance.now(), dur, from: frontCover.rotation.z, to, then };
      }
      function openBinder(then) {
        if (!closed) return; // 들썩이는 중이어도 바로 열림
        closed = false;
        const hint = document.getElementById("hint");
        setTimeout(() => (hint.style.opacity = 0), 7000);
        hint.textContent = "종이를 잡고 옆으로 끌거나, 종이를 눌러서 넘기세요";
        coverTo(0, 1600, then);
        ui();
      }
      function closeBinder() {
        if (closed || opening || cur !== 0) return;
        closed = true;
        hideWork();
        coverTo(-Math.PI, 1400);
        ui();
      }

      function go(t) {
        if (closed) return openBinder(() => t > 0 && go(t));
        if (opening) return;
        if (t < 0 && cur === 0) return closeBinder();
        t = Math.max(0, Math.min(S - 1, t));
        if (t === cur) return;
        const from = cur;
        cur = t;
        const order = t > from ? leaves.slice(from, t) : leaves.slice(t, from).reverse();
        order.forEach((lf, k) => animLeaf(lf, lf.i < cur ? Math.PI : 0, k * 150));
        ui();
        hideWork();
      }

      /* ── 작품 보이기 / 숨기기 ── */
      let shownFor = -1;
      function hideWork() {
        workObj.visible = false; // CSS3DRenderer가 display를 매 프레임 덮어쓰므로 visible로 숨김
        hole.visible = false;
      }
      function showWork() {
        const w = WORKS[cur];
        if (overview || closed || !w || !w.folder) return hideWork();
        // 지금 오른쪽 맨 위 종이의 높이
        const y = cur < LEAVES ? restY(cur, false) : 0.004;
        hole.position.set(frameCX, y + 0.0008, frameCZ);
        workObj.position.set(frameCX, y + 0.0008, frameCZ);
        hole.visible = true;
        workObj.visible = true;
        if (shownFor !== cur) {
          shownFor = cur;
          iframe.src = encodeURI(w.folder) + "/index.html";
          iframe.title = w.title;
        }
      }

      /* ═════════ 5. 화면 맞추기 · 카메라 ═════════ */
      let mouse = { x: 0, y: 0 };
      let opening = null;
      let zoom = 1;
      function resize() {
        const w = innerWidth,
          h = innerHeight;
        renderer.setSize(w, h, false);
        glCanvas.style.width = w + "px";
        glCanvas.style.height = h + "px";
        cssRenderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      function placeCamera() {
        // 바인더 전체(가로 3.6 · 세로 1.2)가 화면에 들어오게 거리 조절
        const vf = THREE.MathUtils.degToRad(camera.fov);
        const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
        // 펼치면 화면 가득, 닫혀 있을 땐 표지 하나가 화면 가득 (열리면서 뒤로 빠짐)
        const open = frontCover.rotation.z / -Math.PI; // 1 = 닫힘
        const distOpen = Math.max(1.86 / Math.tan(hf / 2), 0.64 / Math.tan(vf / 2));
        const distClosed = Math.max(1.05 / Math.tan(hf / 2), 0.76 / Math.tan(vf / 2));
        const dist = (distOpen + (Math.min(distOpen, distClosed) - distOpen) * open) * zoom;
        // 바로 위에서 내려다보는 시점 (마우스에 아주 살짝만 반응)
        camera.up.set(0, 0, -1);
        camera.position.set(target.x + mouse.x * 0.04, dist, target.z + mouse.y * 0.04 + 0.001);
        camera.lookAt(target);
      }
      addEventListener("resize", resize);

      /* ═════════ 6. 끌어서 · 눌러서 넘기기 ═════════ */
      const raycaster = new THREE.Raycaster();
      let drag = null;
      function screenX(v) {
        const p = v.clone().project(camera);
        return (p.x * 0.5 + 0.5) * innerWidth;
      }
      addEventListener("pointerdown", (e) => {
        if (overview || e.target.closest("button, a, #desk")) return;
        // 색인 탭을 누르면 그 작품으로
        const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const th = raycaster.intersectObjects(tabObjs.flatMap((t) => [t.front, t.back]))[0];
        if (th && !opening) return (stopDemo(), go(th.object.userData.tab));
        if (closed && labelMesh) {
          // 표지 목차(정사각형 줄)를 누르면 표지를 열고 바로 그 작품으로
          const hit = raycaster.intersectObject(labelMesh)[0];
          if (hit) {
            const px = hit.uv.x * LW,
              py = (1 - hit.uv.y) * LH;
            const row = coverTocHit(COVER, WORKS, px, py);
            if (row >= 0) return (stopDemo(), openBinder(() => row > 0 && go(row)));
          }
        }
        if (closed) return (stopDemo(), openBinder());
        if (opening) return;
        stopDemo();
        const spineX = screenX(new THREE.Vector3(0, 0, 0));
        const pagePx = Math.abs(screenX(new THREE.Vector3(P0 + PW, 0, 0)) - spineX);
        const right = e.clientX > spineX;
        const i = right ? cur : cur - 1;
        drag = { x0: e.clientY * 0 + e.clientX, y0: e.clientY, right, pagePx, lf: leaves[i] || null, moved: false };
        // 끄는 중에 손가락/마우스가 작품 화면이나 창 밖으로 나가도 놓친 걸로 처리되지 않게 붙잡아 둠
        workEl.style.pointerEvents = "none";
        try {
          document.documentElement.setPointerCapture(e.pointerId);
        } catch {}
        if (drag.lf) {
          drag.lf.anim = null;
          drag.lf.moving = true;
          drag.lf.dir = right ? 1 : -1;
        }
      });
      addEventListener("pointermove", (e) => {
        mouse.x = (e.clientX / innerWidth) * 2 - 1;
        mouse.y = (e.clientY / innerHeight) * 2 - 1;
        if (!drag) return;
        const dx = e.clientX - drag.x0;
        if (Math.abs(dx) > 6) drag.moved = true;
        if (!drag.lf || !drag.moved) return;
        hideWork();
        const k = (-dx / drag.pagePx) * Math.PI;
        drag.lf.theta = drag.right ? THREE.MathUtils.clamp(k, 0, Math.PI) : THREE.MathUtils.clamp(Math.PI + k, 0, Math.PI);
        placeLeaf(drag.lf);
      });
      function endDrag(e) {
        workEl.style.pointerEvents = "";
        if (!drag) return;
        const d = drag;
        drag = null;
        if (d.lf) d.lf.moving = false;
        if (!d.moved) {
          // 그냥 누름: 누른 쪽으로 한 장 (첫 장에서 왼쪽을 누르면 표지를 덮음)
          if (d.lf) go(cur + (d.right ? 1 : -1));
          else if (!d.right && cur === 0) closeBinder();
          return;
        }
        if (!d.lf) return;
        const done = d.right ? d.lf.theta > Math.PI * 0.3 : d.lf.theta < Math.PI * 0.7;
        if (done) {
          cur += d.right ? 1 : -1;
          ui();
        }
        animLeaf(d.lf, d.lf.i < cur ? Math.PI : 0, 0, 600);
      }
      addEventListener("pointerup", endDrag);
      // 놓는 순간을 못 받는 경우(창 밖, 탭 전환 등)에도 종이가 서 있지 않게 마무리
      document.documentElement.addEventListener("lostpointercapture", endDrag);
      addEventListener("blur", endDrag);
      document.addEventListener("pointerleave", endDrag);
      addEventListener("pointercancel", endDrag);

      /* ═════════ 7. 버튼 · 탭 · 키보드 · 시범 ═════════ */
      document.getElementById("prevBtn").onclick = () => (stopDemo(), go(cur - 1));
      const next = () => (stopDemo(), closed ? openBinder() : go(cur + 1));
      document.getElementById("nextBtn").onclick = next;
      /* ── 전체 보기 ── */
      const allBtn = document.getElementById("allBtn");
      // 전체 보기: 작품 화면 자체를 작게 띄워서 한눈에 (열 때만 불러오고, 닫으면 멈춤)
      const deskFrames = [];
      function buildDesk() {
        const box = document.getElementById("sheets");
        WORKS.forEach((w, i) => {
          const b = document.createElement("button");
          b.className = "sheet" + (w.folder ? "" : " soon");
          b.style.setProperty("--r", [-1.6, 1.2, -0.9, 1.8, -1.4, 1.0][i % 6] + "deg");
          b.style.setProperty("--d", i * 70 + "ms");
          b.setAttribute("aria-label", w.title + " 펼치기");
          const scr = document.createElement("div");
          scr.className = "scr";
          if (w.folder) {
            const f = document.createElement("iframe");
            f.tabIndex = -1;
            f.setAttribute("aria-hidden", "true");
            f.addEventListener("load", () => f.src !== "about:blank" && fitFrame(f));
            scr.appendChild(f);
            deskFrames.push({ f, src: encodeURI(w.folder) + "/index.html", scr });
          } else {
            const t = document.createElement("div");
            t.className = "soonTxt";
            t.textContent = "COMING SOON";
            scr.appendChild(t);
          }
          const n = document.createElement("span");
          n.className = "n";
          n.textContent = pad(i + 1);
          const cap = document.createElement("span");
          cap.className = "cap";
          cap.innerHTML = `${w.title.replace(/</g, "&lt;")}<small>${w.type.replace(/</g, "&lt;")}</small>`;
          b.append(scr, n, cap);
          b.onclick = (e) => {
            e.stopPropagation();
            setOverview(false);
            setTimeout(() => (closed ? openBinder(() => go(i)) : go(i)), 350);
          };
          box.appendChild(b);
        });
        // 화면 크기에 맞춰 작품(1600×1000)을 칸에 맞게 줄임
        const ro = new ResizeObserver(() => deskFrames.forEach(({ f, scr }) => (f.style.transform = `scale(${scr.clientWidth / 1600})`)));
        deskFrames.forEach(({ scr }) => ro.observe(scr));
        document.getElementById("desk").onclick = () => setOverview(false);
      }
      let overview = false;
      function setOverview(on) {
        overview = on;
        stopDemo();
        document.body.classList.toggle("overview", on);
        document.getElementById("desk").setAttribute("aria-hidden", String(!on));
        allBtn.textContent = on ? "✕ 닫기" : "▦ 전체 보기";
        if (on) hideWork();
        else if (!closed) setTimeout(showWork, 400);
        // 열 때 작품 불러오기 · 닫을 때 비워서 멈춤
        deskFrames.forEach(({ f, src }) => (f.src = on ? src : "about:blank"));
      }
      allBtn.onclick = () => setOverview(!overview);
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && overview) return setOverview(false);
        if (overview) return;
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") (stopDemo(), go(cur - 1));
      });
      function ui() {
        document.getElementById("count").textContent = closed ? "— / " + pad(S) : pad(cur + 1) + " / " + pad(S);
        tabObjs.forEach((t) => t.set(!closed && t.i === cur));
        const w = WORKS[cur];
        const ob = document.getElementById("openBtn");
        ob.hidden = closed || !(w && w.folder);
        if (w && w.folder) ob.href = encodeURI(w.folder) + "/index.html";
      }
      const demoBtn = document.createElement("button"); // 시범 넘기기 버튼은 뺌 (기능만 남겨 둠)
      let demoTm = null;
      function startDemo() {
        if (demoTm) return stopDemo();
        demoBtn.textContent = "■ 멈추기";
        if (closed) {
          openBinder();
          demoTm = setTimeout(() => {
            demoTm = null;
            startDemo();
          }, 1900);
          return;
        }
        const step = () => {
          if (cur < S - 1) {
            go(cur + 1);
            demoTm = setTimeout(step, 2300);
          } else
            demoTm = setTimeout(() => {
              go(0);
              stopDemo();
              setTimeout(closeBinder, LEAVES * 150 + 1300); // 다 넘긴 뒤 다시 표지를 덮음
            }, 1800);
        };
        if (cur === S - 1) go(0);
        demoTm = setTimeout(step, cur === S - 1 ? 1700 : 300);
      }
      function stopDemo() {
        clearTimeout(demoTm);
        demoTm = null;
        demoBtn.textContent = "▶ 시범으로 넘겨 보기";
      }
      demoBtn.onclick = startDemo;

      /* ═════════ 8. 그리기 ═════════ */
      let wasMoving = true;
      function frame(now) {
        for (const lf of leaves) {
          if (!lf.anim) continue;
          const t = (now - lf.anim.t0) / lf.anim.dur;
          if (t < 0) continue;
          lf.moving = t < 1;
          lf.theta = lf.anim.from + (lf.anim.to - lf.anim.from) * ease(Math.min(1, t));
          placeLeaf(lf);
          if (t >= 1) lf.anim = null;
        }
        // 어떤 이유로든 중간에 멈춘 종이는 제자리로 마저 넘김
        if (!drag)
          for (const lf of leaves) {
            const goal = lf.i < cur ? Math.PI : 0;
            if (!lf.anim && Math.abs(lf.theta - goal) > 1e-3) animLeaf(lf, goal, 0, 600);
          }
        const moving = anyMoving();
        if (wasMoving && !moving) showWork();
        wasMoving = moving;
        // 비닐 반사 줄무늬가 마우스 · 시점에 따라 흐름
        streakTex.offset.x = -mouse.x * 0.25;
        streakTex.offset.y = mouse.y * 0.12;
        // 바인더가 펼쳐지는 동작 (+ 카메라가 살짝 다가감)
        if (opening) {
          const t = Math.min(1, Math.max(0, (now - opening.t0) / opening.dur));
          frontCover.rotation.z = opening.from + (opening.to - opening.from) * ease(t);
          if (t >= 1) {
            const then = opening.then;
            opening = null;
            if (then) then();
          }
        }
        // 닫힌 바인더는 화면 가운데, 펼치면 두 면이 가운데 오도록 이동
        target.x = CVX * (frontCover.rotation.z / -Math.PI);
        placeCamera();
        renderer.render(scene, camera);
        cssRenderer.render(cssScene, camera);
        requestAnimationFrame(frame);
      }

      /* 글꼴을 받은 뒤 종이를 그리고 시작 */
      // 표지 설정: 같은 폴더의 cover.json (없으면 기본값). ?draft 로 열면 편집기에서 저장한 임시본
      const coverReady = (async () => {
        try {
          if (location.search.includes("draft")) {
            const d = localStorage.getItem("coverDraft");
            if (d) return (COVER = mergeCover(JSON.parse(d)));
          }
        } catch {}
        try {
          const r = await fetch("cover.json", { cache: "no-store" });
          if (r.ok) COVER = mergeCover(await r.json());
        } catch {}
      })();
      // 내지 글(제목 · 구분 · ABOUT · HOW TO PLAY): 같은 폴더의 works.json 이 있으면 그걸로 덮어씀 (works_editor.html 에서 만듦)
      const worksReady = (async () => {
        let data = null;
        try {
          if (location.search.includes("draft")) data = JSON.parse(localStorage.getItem("worksDraft") || "null");
        } catch {}
        if (!data)
          try {
            const r = await fetch("works.json", { cache: "no-store" });
            if (r.ok) data = await r.json();
          } catch {}
        if (!Array.isArray(data)) return;
        data.forEach((d, i) => {
          const w = WORKS.find((x) => x.folder && x.folder === d.folder) || (!d.folder && WORKS[i]);
          if (!w) return;
          for (const k of ["title", "type", "en"]) if (typeof d[k] === "string") w[k] = d[k];
          for (const k of ["desc", "how"]) if (Array.isArray(d[k])) w[k] = d[k].map(String);
        });
      })();
      Promise.race([
        Promise.all(
          ['800 40px Inter', '700 40px Inter', '400 40px "Pinyon Script"', '600 40px "IBM Plex Mono"', '700 40px "IBM Plex Mono"', '400 40px "IBM Plex Mono"', '500 40px "IBM Plex Mono"', 'italic 400 40px "IBM Plex Mono"', '400 40px "Nanum Gothic Coding"', '700 40px "Nanum Gothic Coding"'].map((f) =>
            document.fonts.load(f, "가A").catch(() => 0),
          ).concat(
            coverReady.then(() => Promise.all(COVER.items.map((it) => document.fonts.load(coverFont(it, 40), "A가").catch(() => 0)))),
          ),
        ),
        new Promise((r) => setTimeout(r, 2500)),
      ])
        .then(() => Promise.all([coverReady, worksReady]))
        .then(() => {
        build();
        coverMat.color.setStyle(`rgb(${COVER.bg},${COVER.bg},${COVER.bg})`);
        addCoverLabel();
        frontCover.rotation.z = -Math.PI; // 처음엔 닫힌 상태 — 누르면 펼쳐짐
        resize();
        ui();
        hideWork();
        requestAnimationFrame(frame);
        const ld = document.getElementById("loading");
        ld.style.opacity = 0;
        setTimeout(() => ld.remove(), 700);
        // 처음: 닫힌 표지를 살짝 들썩여 '열 수 있다'는 힌트 (열 때까지 몇 초마다)
        const peek = () => {
          if (!closed || opening) return;
          coverTo(-Math.PI + 0.32, 550, () => closed && coverTo(-Math.PI, 650));
        };
        setTimeout(peek, 1800);
        setInterval(() => (closed ? peek() : 0), 6000);
      });
    </script>
  </body>
</html>
